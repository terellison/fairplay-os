[workspace]
resolver = "2"
members = [
    "crates/safewrite",
    "crates/assetguard",
    "crates/fairplay-common",
    "crates/fairplayd",
    "crates/fairplay-attest",
    "crates/cheatsim",
]
# The eBPF program targets bpfel-unknown-none and needs nightly + bpf-linker,
# so it builds on its own (see README).
exclude = ["crates/fairplay-ebpf"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fairplay-common = { path = "crates/fairplay-common" }
safewrite = { path = "crates/safewrite" }
