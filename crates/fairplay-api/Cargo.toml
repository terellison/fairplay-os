[package]
name = "fairplay-api"
description = "fairplayd's socket protocol (request/response types), a client, and fairplayctl"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
clap.workspace = true
ed25519-dalek = "2"
nix = { workspace = true, features = ["socket", "uio"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[[bin]]
name = "fairplayctl"
path = "src/bin/fairplayctl.rs"
