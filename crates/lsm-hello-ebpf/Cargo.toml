[package]
name = "lsm-hello-ebpf"
description = "Milestone 1 smoke test: BPF LSM program that logs file_open by `cat`"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[dependencies]
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"

[[bin]]
name = "lsm-hello"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
overflow-checks = false
panic = "abort"

[profile.release]
debug = 2
panic = "abort"

# Standalone workspace: built for bpfel-unknown-none with nightly.
[workspace]
