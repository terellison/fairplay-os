[package]
name = "fairplay-attest"
description = "TPM quote + IMA log collection, and the server-side verifier (milestone 10)"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
# Real TPM access for `collect`. Needs libtss2 (apt install libtss2-dev) and a
# TPM: /dev/tpmrm0, or swtpm over its socket TCTI (libtss2-tcti-swtpm0).
# `verify` is pure Rust and works without this feature.
tpm = ["dep:tss-esapi"]

[dependencies]
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.10"
tss-esapi = { version = "7", optional = true }
