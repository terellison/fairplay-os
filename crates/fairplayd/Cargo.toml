[package]
name = "fairplayd"
description = "Loads the fairplay LSM program, owns the protected-process map, serves the socket API"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = ["tpm"]
# `attest` quotes with the TPM (libtss2: apt install libtss2-dev). Without
# it, `attest` always answers `unavailable`.
tpm = ["fairplay-attest/tpm"]

[dependencies]
anyhow.workspace = true
aya = "0.13"
clap.workspace = true
fairplay-api.workspace = true
fairplay-attest = { path = "../fairplay-attest" }
fairplay-common = { workspace = true, features = ["user"] }
libc = "0.2"
nix = { workspace = true, features = ["socket", "uio", "user", "process"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "macros", "time"] }

[dev-dependencies]
ed25519-dalek = "2"
serde_json.workspace = true
