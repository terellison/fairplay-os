[package]
name = "fairplay-common"
description = "Types shared between the fairplay eBPF program and user space"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
# Enabled by user-space crates so map values can cross into aya.
user = ["dep:aya"]

[dependencies]
aya = { version = "0.13", optional = true }

[lib]
path = "src/lib.rs"
